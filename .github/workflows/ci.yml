name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]

jobs:
  lint:
    if: github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint nextjs-pure
        run: pnpm --filter nextjs-pure lint

      - name: Lint nextjs-test
        run: pnpm --filter nextjs-test lint
