name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main, testA]
  merge_group:
    branches: [main, testA]

jobs:
  sonarqube:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v7
        with:
          args: >
            -Dsonar.organization=jay-test-team
            -Dsonar.projectKey=jay-test-team_game-project
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
